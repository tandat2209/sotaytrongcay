<!doctype html>

<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thiết lập cây trồng - Lá Xanh</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              secondary: "#65558f",
              "tertiary-fixed": "#dde3eb",
              outline: "#72796e",
              "error-container": "#ffdad6",
              "on-surface": "#1c1b1b",
              tertiary: "#343a40",
              "on-tertiary-container": "#bdc3cb",
              "on-background": "#1c1b1b",
              "tertiary-container": "#4a5157",
              "surface-container-highest": "#e5e2e1",
              "secondary-fixed-dim": "#cfbdfe",
              "on-primary-fixed": "#002201",
              "secondary-fixed": "#e9ddff",
              "on-primary-container": "#9dd090",
              "surface-container": "#f0eded",
              "primary-container": "#2d5a27",
              "secondary-container": "#cfbdfe",
              "on-secondary-fixed-variant": "#4d3d75",
              "on-primary-fixed-variant": "#23501e",
              background: "#fcf9f8",
              "surface-variant": "#e5e2e1",
              "surface-bright": "#fcf9f8",
              "on-secondary-container": "#594982",
              "inverse-primary": "#a1d494",
              "on-tertiary": "#ffffff",
              "inverse-surface": "#313030",
              "on-tertiary-fixed-variant": "#41474e",
              "on-surface-variant": "#42493e",
              "inverse-on-surface": "#f3f0ef",
              "surface-container-low": "#f6f3f2",
              "surface-dim": "#dcd9d9",
              surface: "#fcf9f8",
              "on-secondary-fixed": "#201047",
              "tertiary-fixed-dim": "#c1c7cf",
              primary: "#154212",
              "surface-container-lowest": "#ffffff",
              "outline-variant": "#c2c9bb",
              "surface-container-high": "#eae7e7",
              "on-tertiary-fixed": "#161c22",
              error: "#ba1a1a",
              "on-secondary": "#ffffff",
              "primary-fixed-dim": "#a1d494",
              "surface-tint": "#3b6934",
              "on-error": "#ffffff",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "primary-fixed": "#bcf0ae",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "container-margin": "16px",
              xs: "4px",
              xl: "32px",
              lg: "24px",
              md: "16px",
              base: "4px",
              sm: "8px",
              gutter: "16px",
            },
            fontFamily: {
              "headline-sm": ["Inter"],
              "label-sm": ["Inter"],
              "headline-lg": ["Inter"],
              "headline-md": ["Inter"],
              "body-md": ["Inter"],
              "label-md": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              "headline-sm": [
                "18px",
                { lineHeight: "24px", fontWeight: "600" },
              ],
              "label-sm": ["10px", { lineHeight: "12px", fontWeight: "600" }],
              "headline-lg": [
                "28px",
                {
                  lineHeight: "34px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "22px",
                {
                  lineHeight: "28px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #fcf9f8;
        -webkit-tap-highlight-color: transparent;
      }
      .custom-scroll-hide::-webkit-scrollbar {
        display: none;
      }
      .custom-scroll-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .active-pill {
        background-color: #2d5a27;
        color: #ffffff;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen text-on-surface">
    <!-- TopAppBar -->
    <header
      class="w-full sticky top-0 z-40 bg-background flex items-center justify-between px-container-margin h-16 transition-opacity active:opacity-70"
    >
      <div class="flex items-center gap-4">
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors"
        >
          <span class="material-symbols-outlined text-primary">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md text-primary">
          Thiết lập: Nho
        </h1>
      </div>
      <button
        class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors"
      >
        <span class="material-symbols-outlined text-primary">search</span>
      </button>
    </header>
    <main class="flex-grow px-container-margin pb-32">
      <!-- Hero Section / Plant Identity -->
      <section class="mt-lg mb-xl">
        <div
          class="relative w-full h-48 rounded-xl overflow-hidden mb-md border border-outline-variant"
        >
          <div
            class="absolute inset-0 bg-cover bg-center"
            data-alt="A lush green grape vine with tiny emerging tendrils climbing a minimalist wooden trellis in a sun-drenched balcony setting. The lighting is soft and warm, highlighting the vibrant emerald green leaves. The overall aesthetic is calm, professional, and organic, consistent with a premium gardening application interface."
            style="
              background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuAjTmAb6l7JeRz1gZsIz5_OLuqacDW2HrNqczuikWhfmw4QXpEBVmaF6u9zW6BZfJFye9n4yD1gGu5ckagcbekKB9IgI0vA8Y6nW5nSS0kAtLResiCISYvtFYEp54LYRcrnO6K6Ym6_ezLQzPGFWlXl53Jprwztk7GzQ8UIHH5KTmZyGWVJQjDWxSkgueEonznJxJjmrxGOPflf3D-VYWf0abPbqpG7VMk_0DDxvm5elZSEu5UJKKWSMZyafe9ZbzBHHu_GOWVu8aCA&quot;);
            "
          ></div>
          <div
            class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"
          ></div>
          <div class="absolute bottom-4 left-4 text-white">
            <span
              class="px-2 py-1 bg-primary text-white text-[10px] font-bold rounded uppercase tracking-wider"
              >Vitis vinifera</span
            >
          </div>
        </div>
      </section>
      <!-- Configuration Form -->
      <div class="space-y-lg max-w-2xl mx-auto">
        <!-- Field: Tên gọi riêng -->
        <div class="group">
          <label
            class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1"
            for="plant-name"
            >Tên gọi riêng</label
          >
          <div class="relative">
            <input
              class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-lg text-body-lg"
              id="plant-name"
              placeholder="Ví dụ: Nho ban công"
              type="text"
              value="Nho sân thượng"
            />
            <span
              class="material-symbols-outlined absolute right-4 top-3 text-outline-variant"
              >edit</span
            >
          </div>
        </div>
        <!-- Field: Vị trí -->
        <div class="group">
          <label
            class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1"
            for="location"
            >Vị trí</label
          >
          <div class="relative">
            <input
              class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-lg text-body-lg"
              id="location"
              placeholder="Nơi bạn đặt cây..."
              type="text"
              value="Ban công hướng Đông"
            />
            <span
              class="material-symbols-outlined absolute right-4 top-3 text-outline-variant"
              >location_on</span
            >
          </div>
        </div>
        <!-- Field: Ngày bắt đầu trồng -->
        <div class="group">
          <label
            class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1"
            for="start-date"
            >Ngày bắt đầu trồng</label
          >
          <div class="relative">
            <input
              class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-lg text-body-lg appearance-none"
              id="start-date"
              type="date"
            />
            <span
              class="material-symbols-outlined absolute right-4 top-3 text-outline-variant pointer-events-none"
              >calendar_today</span
            >
          </div>
        </div>
        <!-- Selection: Giai đoạn hiện tại -->
        <div class="space-y-md">
          <label
            class="block font-label-md text-label-md text-on-surface-variant ml-1"
            >Giai đoạn hiện tại</label
          >
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-sm">
            <!-- Dynamic Selection Chips -->
            <button
              class="stage-chip flex items-center gap-sm px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active:scale-95"
              onclick="selectStage(this)"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >potted_plant</span
              >
              <span class="font-label-md text-label-md">Hạt mầm</span>
            </button>
            <button
              class="stage-chip active-pill flex items-center gap-sm px-4 py-3 border border-primary rounded-xl transition-all active:scale-95"
              onclick="selectStage(this)"
            >
              <span
                class="material-symbols-outlined text-[20px]"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >spa</span
              >
              <span class="font-label-md text-label-md">Cây con</span>
            </button>
            <button
              class="stage-chip flex items-center gap-sm px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active:scale-95"
              onclick="selectStage(this)"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >eco</span
              >
              <span class="font-label-md text-label-md">Nuôi thân</span>
            </button>
            <button
              class="stage-chip flex items-center gap-sm px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active:scale-95"
              onclick="selectStage(this)"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >account_tree</span
              >
              <span class="font-label-md text-label-md">Leo giàn</span>
            </button>
            <button
              class="stage-chip flex items-center gap-sm px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active:scale-95"
              onclick="selectStage(this)"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >filter_vintage</span
              >
              <span class="font-label-md text-label-md">Ra hoa</span>
            </button>
            <button
              class="stage-chip flex items-center gap-sm px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl transition-all hover:bg-surface-container-high active:scale-95"
              onclick="selectStage(this)"
            >
              <span class="material-symbols-outlined text-[20px] text-primary"
                >nutrition</span
              >
              <span class="font-label-md text-label-md">Đậu quả</span>
            </button>
          </div>
        </div>
        <!-- Action Area -->
        <div class="pt-xl">
          <button
            class="w-full h-12 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm"
          >
            <span>Hoàn tất thêm cây</span>
            <span class="material-symbols-outlined">check_circle</span>
          </button>
          <p
            class="text-center font-label-sm text-label-sm text-on-surface-variant mt-md px-lg"
          >
            Bạn có thể thay đổi các thông tin này bất kỳ lúc nào trong phần cài
            đặt cây trồng.
          </p>
        </div>
      </div>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest dark:bg-surface-container-low border-t border-outline-variant dark:border-outline shadow-sm flex justify-around items-center h-16 px-4 pb-safe"
    >
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 duration-200"
        href="#"
      >
        <span class="material-symbols-outlined">today</span>
        <span class="font-label-md text-label-md">Hôm nay</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-semibold hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 duration-200"
        href="#"
      >
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >potted_plant</span
        >
        <span class="font-label-md text-label-md">Cây trồng</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 duration-200"
        href="#"
      >
        <span class="material-symbols-outlined">menu_book</span>
        <span class="font-label-md text-label-md">Nhật ký</span>
      </a>
      <a
        class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary-fixed transition-colors active:scale-95 duration-200"
        href="#"
      >
        <span class="material-symbols-outlined">person</span>
        <span class="font-label-md text-label-md">Tôi</span>
      </a>
    </nav>
    <script>
      function selectStage(element) {
        // Remove active classes from all chips
        document.querySelectorAll(".stage-chip").forEach((chip) => {
          chip.classList.remove("active-pill");
          chip.classList.remove("border-primary");
          chip.classList.add("bg-surface-container-low");
          chip.classList.add("border-outline-variant");
          const icon = chip.querySelector(".material-symbols-outlined");
          icon.classList.add("text-primary");
          icon.style.fontVariationSettings = "'FILL' 0";
        });

        // Add active classes to selected chip
        element.classList.add("active-pill");
        element.classList.remove("bg-surface-container-low");
        element.classList.remove("border-outline-variant");
        element.classList.add("border-primary");
        const activeIcon = element.querySelector(".material-symbols-outlined");
        activeIcon.classList.remove("text-primary");
        activeIcon.style.fontVariationSettings = "'FILL' 1";
      }

      // Set default date to today
      document.getElementById("start-date").valueAsDate = new Date();
    </script>
  </body>
</html>
