    <style>
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 20px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 20px);
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>

  <body
    class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-safe"
  >
    <!-- Header (Tôi) -->
    <header
      class="bg-surface dark:bg-surface-container-low px-container-margin py-md flex items-center justify-between shadow-sm relative z-10 hidden md:flex h-16 max-w-7xl mx-auto w-full"
    >
      <div class="flex items-center gap-xs">
        <span class="material-symbols-outlined text-primary text-[24px]"
          >eco</span
        >
        <h1
          class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed"
        >
          Sổ tay trồng cây
        </h1>
      </div>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="flex-grow w-full max-w-2xl mx-auto px-container-margin py-lg pb-32"
    >
      <!-- Profile Header -->
      <div class="flex flex-col items-center justify-center mb-xl">
        <div
          class="w-24 h-24 rounded-full overflow-hidden border-2 border-outline-variant shadow-sm mb-md relative bg-surface-container"
        >
          <img
            alt="User Avatar"
            class="w-full h-full object-cover"
            data-alt="A close-up portrait of a gardener, bathed in soft, natural morning light. The person is wearing a subtle olive green shirt, smiling gently in a bright, modern greenhouse setting with lush green foliage out of focus in the background. The aesthetic is clean, organic, and professional."
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdGDdevukjyqCq3f-PawOJolN8zqAgdWfo8S9rUOilr_lLCNZFg9kcegeuYdRfnLypoJ5Qchx_Kkb8-fGuCsJ2O7CYgTn2ZH5WlVxOHcC3Sm-JmW_YXjMZkgP8CupPoQMEQZvVsUISjn8Y0wi37k4K7DIJH3C2ssy0_-p1SjRXYSBWI2cK_AYS4lxEHxwFvrJ31H5wbFcPsicPzQmoEC9wS6u2EYgIY8xC2d77UC7d1DvNwMzTBSGzIz0ey4eBV2dy4HWy5gALfa4Q"
          />
          <button
            class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-sm shadow-md flex items-center justify-center hover:bg-primary-container transition-colors"
          >
            <span class="material-symbols-outlined text-[16px]">edit</span>
          </button>
        </div>
        <h2 class="font-headline-sm text-headline-sm text-on-background mb-xs">
          Nguyễn Văn A
        </h2>
        <p class="font-body-md text-body-md text-on-surface-variant">
          Thợ làm vườn mới nhú
        </p>
      </div>
      <!-- Settings Groups -->
      <div class="space-y-lg">
        <!-- Group 1: Cài đặt chung -->
        <section
          class="bg-surface rounded-xl border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.04)] overflow-hidden"
        >
          <h3
            class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-md py-sm bg-surface-container-lowest border-b border-outline-variant"
          >
            Cài đặt chung
          </h3>
          <div class="divide-y divide-outline-variant">
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >notifications</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Thông báo</span
                >
              </div>
              <span class="material-symbols-outlined text-outline-variant"
                >chevron_right</span
              >
            </button>
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >alarm</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Lời nhắc</span
                >
              </div>
              <span class="material-symbols-outlined text-outline-variant"
                >chevron_right</span
              >
            </button>
          </div>
        </section>
        <!-- Group 2: Dữ liệu -->
        <section
          class="bg-surface rounded-xl border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.04)] overflow-hidden"
        >
          <h3
            class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-md py-sm bg-surface-container-lowest border-b border-outline-variant"
          >
            Dữ liệu
          </h3>
          <div class="divide-y divide-outline-variant">
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >cloud_upload</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Sao lưu đám mây</span
                >
              </div>
              <span
                class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs"
              >
                Đã đồng bộ
                <span
                  class="material-symbols-outlined text-outline-variant text-[16px]"
                  >chevron_right</span
                >
              </span>
            </button>
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >download</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Xuất dữ liệu</span
                >
              </div>
              <span class="material-symbols-outlined text-outline-variant"
                >chevron_right</span
              >
            </button>
          </div>
        </section>
        <!-- Group 3: Ứng dụng -->
        <section
          class="bg-surface rounded-xl border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.04)] overflow-hidden"
        >
          <h3
            class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider px-md py-sm bg-surface-container-lowest border-b border-outline-variant"
          >
            Ứng dụng
          </h3>
          <div class="divide-y divide-outline-variant">
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >language</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Ngôn ngữ</span
                >
              </div>
              <span
                class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs"
              >
                Tiếng Việt
                <span
                  class="material-symbols-outlined text-outline-variant text-[16px]"
                  >chevron_right</span
                >
              </span>
            </button>
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >dark_mode</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Giao diện</span
                >
              </div>
              <span
                class="font-body-md text-body-md text-on-surface-variant flex items-center gap-xs"
              >
                Hệ thống
                <span
                  class="material-symbols-outlined text-outline-variant text-[16px]"
                  >chevron_right</span
                >
              </span>
            </button>
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >info</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Giới thiệu</span
                >
              </div>
              <span class="material-symbols-outlined text-outline-variant"
                >chevron_right</span
              >
            </button>
            <button
              class="w-full flex items-center justify-between p-md hover:bg-surface-container-lowest transition-colors group"
            >
              <div class="flex items-center gap-md">
                <span
                  class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors"
                  >chat_bubble</span
                >
                <span class="font-body-lg text-body-lg text-on-background"
                  >Phản hồi</span
                >
              </div>
              <span class="material-symbols-outlined text-outline-variant"
                >chevron_right</span
              >
            </button>
          </div>
        </section>
      </div>
    </main>
    <!-- BottomNavBar Shell (Semantic Active State: Tôi) -->
    <nav
      class="bg-surface dark:bg-surface-container-low fixed bottom-0 w-full h-[64px] pb-safe border-t border-outline-variant dark:border-outline md:hidden z-50"
    >
      <div
        class="flex justify-around items-center w-full px-container-margin h-full"
      >
        <!-- Inactive: Hôm nay -->
        <button
          aria-label="Hôm nay"
          class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high transition-colors flex-1 h-full pt-sm rounded-lg"
        >
          <span class="material-symbols-outlined mb-xs text-[24px]"
            >calendar_today</span
          >
          <span class="font-label-md text-label-md">Hôm nay</span>
        </button>
        <!-- Inactive: Cây trồng -->
        <button
          aria-label="Cây trồng"
          class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high transition-colors flex-1 h-full pt-sm rounded-lg"
        >
          <span class="material-symbols-outlined mb-xs text-[24px]"
            >potted_plant</span
          >
          <span class="font-label-md text-label-md">Cây trồng</span>
        </button>
        <!-- Inactive: Nhật ký -->
        <button
          aria-label="Nhật ký"
          class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-tertiary-container hover:bg-surface-container-high transition-colors flex-1 h-full pt-sm rounded-lg"
        >
          <span class="material-symbols-outlined mb-xs text-[24px]"
            >menu_book</span
          >
          <span class="font-label-md text-label-md">Nhật ký</span>
        </button>
        <!-- ACTIVE: Tôi -->
        <button
          aria-label="Tôi"
          class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-high transition-colors flex-1 h-full pt-sm rounded-lg Active: scale-95 duration-100"
        >
          <span
            class="material-symbols-outlined mb-xs text-[24px]"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >person</span
          >
          <span class="font-label-md text-label-md">Tôi</span>
        </button>
      </div>
    </nav>
  </body>
</html>
