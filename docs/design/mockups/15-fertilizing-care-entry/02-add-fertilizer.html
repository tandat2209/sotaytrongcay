<!doctype html>

<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    />
    <title>Thêm phân bón</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed-dim": "#c1c7cf",
              outline: "#72796e",
              "primary-container": "#2d5a27",
              "on-error-container": "#93000a",
              "error-container": "#ffdad6",
              "tertiary-container": "#4a5157",
              "secondary-container": "#cfbdfe",
              "on-primary-fixed-variant": "#23501e",
              surface: "#fcf9f8",
              "on-surface": "#1c1b1b",
              "inverse-primary": "#a1d494",
              "surface-container-highest": "#e5e2e1",
              "on-background": "#1c1b1b",
              "on-tertiary": "#ffffff",
              "inverse-surface": "#313030",
              "surface-container-high": "#eae7e7",
              "surface-container-low": "#f6f3f2",
              "on-secondary-fixed-variant": "#4d3d75",
              "secondary-fixed": "#e9ddff",
              "on-surface-variant": "#42493e",
              "on-tertiary-fixed-variant": "#41474e",
              "surface-container": "#f0eded",
              "primary-fixed": "#bcf0ae",
              "on-tertiary-container": "#bdc3cb",
              "on-tertiary-fixed": "#161c22",
              "on-error": "#ffffff",
              primary: "#154212",
              "on-secondary-fixed": "#201047",
              "secondary-fixed-dim": "#cfbdfe",
              "surface-bright": "#fcf9f8",
              "surface-dim": "#dcd9d9",
              "surface-variant": "#e5e2e1",
              "on-primary-container": "#9dd090",
              tertiary: "#343a40",
              "surface-tint": "#3b6934",
              error: "#ba1a1a",
              "outline-variant": "#c2c9bb",
              "inverse-on-surface": "#f3f0ef",
              "on-secondary": "#ffffff",
              "on-primary-fixed": "#002201",
              "on-secondary-container": "#594982",
              "on-primary": "#ffffff",
              "tertiary-fixed": "#dde3eb",
              secondary: "#65558f",
              "primary-fixed-dim": "#a1d494",
              "surface-container-lowest": "#ffffff",
              background: "#fcf9f8",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              md: "16px",
              gutter: "16px",
              xl: "32px",
              xs: "4px",
              sm: "8px",
              lg: "24px",
              base: "4px",
              "container-margin": "16px",
            },
            fontFamily: {
              "label-sm": ["Inter"],
              "headline-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg": ["Inter"],
              "body-md": ["Inter"],
              "label-md": ["Inter"],
              "headline-sm": ["Inter"],
            },
            fontSize: {
              "label-sm": [
                "10px",
                {
                  lineHeight: "12px",
                  fontWeight: "600",
                },
              ],
              "headline-md": [
                "22px",
                {
                  lineHeight: "28px",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-lg": [
                "16px",
                {
                  lineHeight: "24px",
                  fontWeight: "400",
                },
              ],
              "headline-lg": [
                "28px",
                {
                  lineHeight: "34px",
                  letterSpacing: "-0.02em",
                  fontWeight: "600",
                },
              ],
              "body-md": [
                "14px",
                {
                  lineHeight: "20px",
                  fontWeight: "400",
                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.02em",
                  fontWeight: "500",
                },
              ],
              "headline-sm": [
                "18px",
                {
                  lineHeight: "24px",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface antialiased min-h-screen flex flex-col"
  >
    <!-- Top App Bar -->
    <header
      class="flex items-center gap-lg px-md h-[64px] w-full top-0 sticky bg-surface border-b border-outline-variant z-10"
    >
      <button
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-100 text-on-surface-variant"
      >
        <span
          class="material-symbols-outlined font-headline-sm text-headline-sm"
          >arrow_back</span
        >
      </button>
      <h1 class="font-headline-sm text-headline-sm text-primary font-bold">
        Thêm phân bón
      </h1>
    </header>
    <!-- Main Content -->
    <main
      class="flex-grow px-container-margin py-md flex flex-col gap-lg pb-[100px]"
    >
      <!-- Input Section -->
      <section class="flex flex-col gap-sm">
        <label
          class="font-label-md text-label-md text-on-surface"
          for="fertilizer-name"
          >Tên phân bón <span class="text-error">*</span></label
        >
        <div class="flex flex-col gap-xs">
          <input
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-md font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
            id="fertilizer-name"
            type="text"
            value="NPK 13-13-21"
          />
          <span class="text-on-surface-variant font-label-md text-label-md"
            >Ví dụ: Phân trùn quế, NPK 20-20-15, Canxi Bo</span
          >
        </div>
      </section>
      <!-- Recently Used Section -->
      <section class="flex flex-col gap-sm">
        <h2
          class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider"
        >
          Dùng gần đây
        </h2>
        <div class="flex flex-wrap gap-sm">
          <button
            class="px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-100"
          >
            Phân trùn quế
          </button>
          <button
            class="px-md py-sm rounded-full border border-primary bg-primary font-body-md text-body-md text-on-primary hover:bg-surface-tint transition-colors active:scale-95 duration-100 font-medium"
          >
            NPK 13-13-21
          </button>
          <button
            class="px-md py-sm rounded-full border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors active:scale-95 duration-100"
          >
            Canxi Bo
          </button>
        </div>
      </section>
      <!-- Category Grid Section -->
      <section class="flex flex-col gap-sm mt-sm">
        <h2 class="font-label-md text-label-md text-on-surface">
          Nhóm phân <span class="text-error">*</span>
        </h2>
        <div class="grid grid-cols-2 gap-md">
          <!-- Category Item -->
          <button
            class="flex flex-col items-center justify-center gap-sm p-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-100 min-h-[96px]"
          >
            <span
              class="material-symbols-outlined text-[32px] text-primary"
              data-weight="fill"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >compost</span
            >
            <span class="font-body-md text-body-md text-on-surface"
              >Hữu cơ</span
            >
          </button>
          <!-- Category Item (Selected) -->
          <button
            class="flex flex-col items-center justify-center gap-sm p-md rounded-lg border-2 border-primary bg-surface-container-low transition-colors active:scale-95 duration-100 min-h-[96px] relative overflow-hidden"
          >
            <div class="absolute inset-0 bg-primary opacity-5"></div>
            <span
              class="material-symbols-outlined text-[32px] text-primary"
              data-weight="fill"
              style="font-variation-settings: &quot;FILL&quot; 1"
              >science</span
            >
            <span class="font-body-md text-body-md text-primary font-medium"
              >NPK</span
            >
            <div class="absolute top-sm right-sm text-primary">
              <span
                class="material-symbols-outlined text-[18px]"
                data-weight="fill"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >check_circle</span
              >
            </div>
          </button>
          <!-- Category Item -->
          <button
            class="flex flex-col items-center justify-center gap-sm p-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-100 min-h-[96px]"
          >
            <span class="material-symbols-outlined text-[32px] text-primary"
              >grain</span
            >
            <span class="font-body-md text-body-md text-on-surface"
              >Phân đơn</span
            >
          </button>
          <!-- Category Item -->
          <button
            class="flex flex-col items-center justify-center gap-sm p-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-100 min-h-[96px]"
          >
            <span class="material-symbols-outlined text-[32px] text-primary"
              >medication_liquid</span
            >
            <span class="font-body-md text-body-md text-on-surface"
              >Bổ sung</span
            >
          </button>
          <!-- Category Item -->
          <button
            class="flex flex-col items-center justify-center gap-sm p-md rounded-lg border border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors active:scale-95 duration-100 min-h-[96px]"
          >
            <span class="material-symbols-outlined text-[32px] text-primary"
              >category</span
            >
            <span class="font-body-md text-body-md text-on-surface">Khác</span>
          </button>
        </div>
      </section>
    </main>
    <!-- Bottom Action Area -->
    <div
      class="fixed bottom-0 left-0 w-full p-container-margin pb-[calc(16px+env(safe-area-inset-bottom))] bg-surface border-t border-outline-variant z-20"
    >
      <button
        class="w-full h-[48px] bg-primary text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center hover:bg-surface-tint transition-colors active:scale-95 duration-100"
      >
        Thêm phân bón
      </button>
    </div>
  </body>
</html>
